<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllMyVids — Coming Soon 🔥</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1 class="logo">AllMyVids</h1>
            <p class="tagline">Premium content, jouw regels.</p>
            
            <div class="coming-soon">
                <span class="badge">Coming Soon</span>
                <p>We bouwen iets speciaals. Binnenkort meer.</p>
            </div>

            <div class="notify-form">
                <h3>Stay in the loop 💋</h3>
                <form id="notify" action="#" method="POST">
                    <input type="email" name="email" placeholder="Je email adres" required>
                    <button type="submit">Notify Me</button>
                </form>
            </div>

            <div class="social-links">
                <a href="#" class="social-link">Twitter</a>
                <a href="#" class="social-link">Instagram</a>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 AllMyVids. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
